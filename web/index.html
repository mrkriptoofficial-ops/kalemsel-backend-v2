<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zikirmatik</title>
<meta name="description" content="Kehribar tesbih hissiyle zikir sayacı">
<meta name="theme-color" content="#0B1733">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zikirmatik">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-top:#14284F;--bg-mid:#0B1733;--bg-bot:#040917;
  --text:#F6F0E1;--sub:#A9B4CB;--faint:rgba(169,180,203,.55);
  --gold:#D4AE62;--gold-l:#F1D9A0;--gold-d:#9C7838;--gold-t:#EBCB86;--on-gold:#071028;
  --glass-t:rgba(255,255,255,.075);--glass-b:rgba(255,255,255,.03);--glass-s:rgba(255,255,255,.14);
  --hair:rgba(255,255,255,.08);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --display:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,sans-serif;--arabic:'Amiri','Geeza Pro',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg-bot)}
body{font-family:var(--sans);color:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  background:radial-gradient(120% 70% at 50% 0%,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-bot) 100%)}
#stars{position:fixed;inset:0;pointer-events:none;opacity:.9}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(var(--sat) + 6px) 18px calc(var(--sab) + 8px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--glass-t),var(--glass-b));border:1px solid var(--glass-s);color:var(--gold-t)}
.round svg{width:24px;height:24px}
.round:active{transform:scale(.94)}
header{display:flex;align-items:center;justify-content:space-between;flex:none}
.brand{text-align:center}
.brand h1{margin:0;font-family:var(--display);font-weight:500;font-size:25px;letter-spacing:.42em;padding-left:.42em;
  background:linear-gradient(100deg,var(--gold-d),var(--gold),var(--gold-l),var(--gold),var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.orn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:2px}
.orn i{display:block;height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{transform:scaleX(-1)}
.orn b{width:7px;height:7px;background:var(--gold-l);transform:rotate(45deg)}
.card{flex:none;margin-top:12px;border-radius:30px;padding:14px 44px 12px;position:relative;text-align:center;
  background:linear-gradient(180deg,var(--glass-t),var(--glass-b));border:1px solid var(--glass-s);min-height:128px;
  display:flex;flex-direction:column;justify-content:center;touch-action:pan-y}
.card .ar{font-family:var(--arabic);font-size:30px;line-height:1.55;direction:rtl;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ok{font-weight:700;letter-spacing:.16em;font-size:14px;color:var(--gold-t);margin-top:4px;text-transform:uppercase}
.card .an{font-size:14.5px;color:var(--sub);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .step{font-size:11.5px;letter-spacing:.18em;color:var(--gold-t);margin-bottom:4px;font-weight:600}
.card .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;display:grid;place-items:center;color:var(--gold-t)}
.card .nav svg{width:22px;height:22px}
.card .prev{left:2px}.card .next{right:2px}
.card.anim-l{animation:cardL .26s ease}.card.anim-r{animation:cardR .26s ease}
@keyframes cardL{from{opacity:.2;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes cardR{from{opacity:.2;transform:translateX(26px)}to{opacity:1;transform:none}}
.dots{flex:none;display:flex;justify-content:center;gap:7px;margin:10px 0 0;height:8px;align-items:center}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(169,180,203,.45);transition:all .25s}
.dots i.on{width:26px;background:var(--gold)}
#domeWrap{flex:1;position:relative;min-height:200px}
#domeBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none}
#dome{display:block;width:100%;height:100%}
#hit{position:absolute;border-radius:50%;cursor:pointer}
#num{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
#num .n{font-family:var(--display);font-weight:500;line-height:1;color:#FFFFFF;font-variant-numeric:lining-nums tabular-nums;
  text-shadow:0 2px 14px rgba(0,0,0,.35)}
#num .n.bump{animation:bump .16s ease-out}
@keyframes bump{from{transform:translateY(10%);opacity:.55}to{transform:none;opacity:1}}
#num .tg{font-weight:600;letter-spacing:.22em;color:#EBCB86;margin-top:4px}
#num .lap{display:inline-block;margin-top:8px;padding:5px 16px;border-radius:20px;font-weight:700;letter-spacing:.14em;color:var(--on-gold);
  background:linear-gradient(100deg,var(--gold-d),var(--gold),var(--gold-l),var(--gold))}
.controls{flex:none;display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.pill{height:52px;padding:0 26px;border-radius:26px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:.04em;
  border:1px solid rgba(212,174,98,.55);background:linear-gradient(180deg,var(--glass-t),var(--glass-b))}
.pill svg{width:17px;height:17px;color:var(--gold-t)}
.pill:active{transform:scale(.97)}
.stats{flex:none;display:flex;justify-content:space-around;margin-top:12px;padding-top:10px;position:relative}
.stats:before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,174,98,.5),transparent)}
.stat{text-align:center;min-width:80px}
.stat small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.16em;color:var(--sub)}
.stat b{display:block;font-family:var(--display);font-weight:500;font-size:30px;color:var(--gold-l);line-height:1.15;font-variant-numeric:lining-nums}
/* alt sayfalar */
#scrim{position:fixed;inset:0;background:rgba(2,5,15,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#13254A,#0A1530);border-top:1px solid var(--glass-s);border-radius:28px 28px 0 0;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);padding-bottom:var(--sab)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:10px auto 4px;flex:none}
.sheet h2{font-family:var(--display);font-weight:500;font-size:26px;margin:4px 20px 10px;color:var(--gold-l)}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 18px;overscroll-behavior:contain}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 15px;border-radius:18px;font-weight:600;font-size:14px;color:var(--sub);border:1px solid var(--hair);background:rgba(255,255,255,.03)}
.tab.on{color:var(--on-gold);background:linear-gradient(100deg,var(--gold),var(--gold-l));border-color:transparent}
.row{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:18px;margin-bottom:8px;background:rgba(255,255,255,.035);border:1px solid var(--hair)}
.row.sel{border-color:rgba(212,174,98,.6);background:rgba(212,174,98,.08)}
.row .tx{flex:1;min-width:0}
.row .t1{font-weight:600;font-size:15.5px}
.row .t0{font-family:var(--arabic);font-size:21px;direction:rtl;text-align:right;line-height:1.5;color:var(--text)}
.row .t2{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.35}
.row .t4{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--gold-t);text-transform:uppercase;margin-bottom:4px}
.row .t3{font-size:12.5px;color:var(--gold-t);margin-top:5px;line-height:1.4;opacity:.9}
.row .meta{font-size:12.5px;color:var(--faint);white-space:nowrap;text-align:right}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--gold-t);flex:none;border:1px solid var(--hair)}
.ib svg{width:18px;height:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:25px;font-weight:700;letter-spacing:.04em;font-size:16px;
  color:var(--on-gold);background:linear-gradient(100deg,var(--gold-d),var(--gold),var(--gold-l),var(--gold))}
.btn.ghost{color:var(--gold-t);background:rgba(255,255,255,.04);border:1px solid rgba(212,174,98,.45)}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--sub);margin:0 4px 6px}
.field input,.field textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--glass-s);border-radius:14px;padding:12px 14px;outline:none;-webkit-user-select:text;user-select:text}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field .arin{font-family:var(--arabic);font-size:22px;direction:rtl}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:10px 16px;border-radius:20px;font-weight:600;border:1px solid var(--glass-s);background:rgba(255,255,255,.04);font-variant-numeric:lining-nums}
.chip.on{color:var(--on-gold);background:linear-gradient(100deg,var(--gold),var(--gold-l));border-color:transparent}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--hair)}
.set .l{font-weight:600}.set .d{font-size:12.5px;color:var(--sub);margin-top:2px}
.sw{width:52px;height:31px;border-radius:16px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.sw.on{background:linear-gradient(100deg,var(--gold),var(--gold-l))}.sw.on:after{transform:translateX(21px)}
.seg{display:flex;background:rgba(255,255,255,.05);border-radius:14px;padding:3px;gap:2px;flex:none}
.seg button{padding:8px 11px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--sub)}
.seg button.on{background:rgba(212,174,98,.22);color:var(--gold-l)}
.beads{display:flex;flex-wrap:wrap;gap:12px 6px;padding:6px 0 4px}
.beads button{width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap}
.beads canvas{width:46px;height:46px;border-radius:50%;outline:2px solid transparent;outline-offset:3px}
.beads button.on canvas{outline-color:var(--gold)}
.beads button.on{color:var(--gold-l)}
.sec{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--gold-t);margin:18px 4px 4px}
.note{font-size:13px;color:var(--sub);line-height:1.5;margin:8px 4px}
/* bildirim */
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,30px);opacity:0;z-index:40;pointer-events:none;
  display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:22px;background:#1B2F5C;border:1px solid var(--glass-s);
  box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .25s;white-space:nowrap;font-weight:600;font-size:14.5px}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--gold-l);font-weight:700}
/* ana ekrana ekle */
#install{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 12px);z-index:30;border-radius:24px;padding:16px 16px 14px;
  background:linear-gradient(180deg,#1B3264,#10214A);border:1px solid rgba(212,174,98,.45);box-shadow:0 16px 40px rgba(0,0,0,.5);
  transform:translateY(140%);transition:transform .4s cubic-bezier(.2,.9,.25,1)}
#install.on{transform:none}
#install .top{display:flex;gap:12px;align-items:center}
#install img{width:48px;height:48px;border-radius:12px}
#install .h{font-weight:700;font-size:16px}
#install .s{font-size:13px;color:var(--sub);margin-top:2px}
#install ol{margin:12px 0 0;padding:0;list-style:none;counter-reset:a}
#install li{counter-increment:a;display:flex;align-items:center;gap:10px;font-size:14.5px;padding:5px 0}
#install li:before{content:counter(a);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--on-gold);background:var(--gold);flex:none}
#install li svg{width:20px;height:20px;color:#5AA2FF;vertical-align:-4px}
#install .x{position:absolute;top:10px;right:10px;width:32px;height:32px;display:grid;place-items:center;color:var(--sub)}
#install .arrow{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);color:var(--gold-l);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(-50%,7px)}}
.hp{position:absolute;width:1px;height:1px;opacity:.01;overflow:hidden;left:-10px;top:-10px}
@media (max-height:700px){.card{min-height:108px;padding-top:10px;padding-bottom:8px}.card .ar{font-size:25px}.stat b{font-size:25px}.round,.pill{height:46px}.round{width:46px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app">
  <header>
    <button class="round" id="bSettings" aria-label="Ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h12M4 17h16"/></svg></button>
    <div class="brand"><h1>ZİKİRMATİK</h1><div class="orn"><i></i><b></b><i></i></div></div>
    <button class="round" id="bLib" aria-label="Zikirler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6.5" height="6.5" rx="3.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="3.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="3.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="3.2"/></svg></button>
  </header>
  <div class="card" id="card">
    <button class="nav prev" id="bPrev" aria-label="Önceki"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="cardBody"></div>
    <button class="nav next" id="bNext" aria-label="Sonraki"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="dots" id="dots"></div>
  <div id="domeWrap">
    <div id="domeBox">
      <canvas id="dome"></canvas>
      <div id="hit" role="button" aria-label="Çek"></div>
      <div id="num"><div class="n" id="nVal">0</div><div class="tg" id="nTarget"></div><div><span class="lap" id="nLap"></span></div></div>
    </div>
  </div>
  <div class="controls">
    <button class="round" id="bUndo" aria-label="Bir eksilt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4.5 11.5 9 16"/><path d="M5 11.5h9a5 5 0 010 10h-2"/></svg></button>
    <button class="pill" id="bTarget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg><span id="targetLbl">Hedef 33</span></button>
    <button class="round" id="bReset" aria-label="Sıfırla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 4v4"/><path d="M7.5 6.3A7.5 7.5 0 1016.5 6.3"/></svg></button>
  </div>
  <div class="stats">
    <div class="stat"><small>BUGÜN</small><b id="sToday">0</b></div>
    <div class="stat"><small>SERİ</small><b id="sStreak">0 gün</b></div>
    <div class="stat"><small>TOPLAM</small><b id="sTotal">0</b></div>
  </div>
</div>

<div id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><h2 id="sheetTitle"></h2><div class="tabs" id="sheetTabs"></div><div class="body" id="sheetBody"></div></div>
<div id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>

<div id="install">
  <button class="x" id="instX" aria-label="Kapat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="top"><img src="icon-180.png" alt=""><div><div class="h">Ana ekrana ekle</div><div class="s" id="instSub">Uygulama gibi tam ekran açılır, internetsiz çalışır.</div></div></div>
  <div id="instBody"></div>
</div>
<label class="hp" aria-hidden="true"><input type="checkbox" switch id="hapticSw"></label>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
