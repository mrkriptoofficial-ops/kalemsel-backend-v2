/* ---------- yönlendirme ---------- */
function isAdminView(v){return ADMIN_VIEWS.includes(v||UI.view)}
function go(v){if(![...ADMIN_VIEWS,...CUST_VIEWS].includes(v))v='vitrin';const changed=UI.view!==v;UI.view=v;try{if(location.hash.slice(1)!==v)location.hash=v}catch(e){}render();if(changed)window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==UI.view&&[...ADMIN_VIEWS,...CUST_VIEWS].includes(v)){UI.view=v;render();window.scrollTo(0,0)}});

function navBadges(){return{sepet:sumBy(S.cart,c=>c.qty),siparisler:S.orders.filter(o=>o.status==='Yeni').length,tamir:S.repairs.filter(r=>r.extra&&r.extra.state!=='bekliyor'&&!r.extra.seen&&r.status<6).length,stok:S.products.filter(p=>p.stock<=p.min).length,randevu:S.appointments.filter(a=>a.status==='Bekliyor').length}}
function renderNav(){
  const adm=isAdminView(),items=adm?ADMIN_NAV:CUST_NAV,bd=navBadges();
  const a=(it,cls)=>`<a class="${UI.view===it[0]?'on':''}" onclick="App.go('${it[0]}')"><span class="i">${it[2]}</span><span>${it[1]}</span>${bd[it[0]]?`<span class="badge">${bd[it[0]]}</span>`:''}</a>`;
  if(adm&&!UI.admin){$('#bnav').innerHTML=CUST_NAV.map(x=>a(x)).join('');$('#side').innerHTML='';return}
  if(adm){const main=ADMIN_NAV.slice(0,4).map(x=>a(x)).join('');const moreOn=!ADMIN_NAV.slice(0,4).some(x=>x[0]===UI.view);const moreBadge=(bd.siparisler||0)+(bd.randevu||0);$('#bnav').innerHTML=main+`<a class="${moreOn?'on':''}" onclick="App.more()"><span class="i">☰</span><span>Daha</span>${moreBadge?`<span class="badge">${moreBadge}</span>`:''}</a>`}
  else $('#bnav').innerHTML=items.map(x=>a(x)).join('');
  $('#side').innerHTML=adm?`<div class="grp">Yönetim</div>${ADMIN_NAV.map(x=>a(x)).join('')}<div class="grp">Hesap</div><a onclick="App.lock()"><span class="i">🔒</span><span>Kilitle</span></a><a onclick="App.go('vitrin')"><span class="i">🛍️</span><span>Müşteri Vitrini</span></a>`:`<div class="grp">Mağaza</div>${CUST_NAV.map(x=>a(x)).join('')}`;
}
function more(){modal('Menü',`<div class="grid g2">${ADMIN_NAV.slice(4).map(x=>`<button class="btn" style="min-height:64px;flex-direction:column" onclick="App.close();App.go('${x[0]}')"><span style="font-size:22px">${x[2]}</span>${x[1]}${navBadges()[x[0]]?` (${navBadges()[x[0]]})`:''}</button>`).join('')}<button class="btn" style="min-height:64px;flex-direction:column" onclick="App.close();App.lock()"><span style="font-size:22px">🔒</span>Kilitle</button></div>`)}

function render(){
  const v=UI.view,adm=isAdminView(v);
  $('#modeBtn').innerHTML=adm?'🛍️ Vitrin':'🔐 Yönetim';
  $('#shopSub').textContent=adm?'YÖNETİM PANELİ':'PROFESSIONAL PHONE REPAIR';
  let h=(adm&&!UI.admin)?vLogin():VIEWS[v]();
  $('#main').innerHTML=h;
  renderNav();
  if(AFTER[v]&&!(adm&&!UI.admin))AFTER[v]();
  if(adm&&!UI.admin)setTimeout(()=>{const p=$('#pin');p&&p.focus()},50);
}

/* =================== MÜŞTERİ TARAFI =================== */
function stockTag(p){return p.stock<=0?'<span class="tag bad">Tükendi</span>':p.stock<=3?`<span class="tag warn">Son ${p.stock} adet</span>`:'<span class="tag ok">Rafta</span>'}
function imgOr(src,ic){return src?`<img src="${esc(src)}" alt="" loading="lazy">`:ic}
function cartQty(t,id){const c=S.cart.find(x=>x.t===t&&x.id===id);return c?c.qty:0}
function vVitrin(){const f=UI.filters,st=S.settings;
  return `<section class="hero"><img class="hl" src="icons/logo-full.jpg" alt="Emin Tech – Professional Phone Repair"><div class="hin"><span class="tag acc">✓ Garantili • Hızlı Servis • Aynı Gün Teslim</span>
  <h1>Telefonunuz <b>Emin</b> ellerde.</h1>
  <p>Telefon modelini seç, <b>rafta şu an gerçekten olan</b> kılıf, cam ve aksesuarları gör. Online seç, mağazadan beklemeden teslim al.</p>
  <select aria-label="Telefon modeli" onchange="App.setF('model',this.value)"><option value="">📱 Telefon modelini seç…</option>${allModels().map(m=>`<option ${m===f.model?'selected':''}>${esc(m)}</option>`).join('')}</select>
  <div class="perks"><span class="tag">🏪 Mağazadan Teslim Al</span><span class="tag">🔧 Canlı Tamir Takibi</span><span class="tag">🎁 Her alışverişte %${esc(st.pointRate)} puan</span></div></div></section>
  ${(!isStandalone()&&!isNative)?`<div class="card instc" onclick="App.install()" role="button" tabindex="0"><div class="ai">${ADD_IC}</div><div style="flex:1;min-width:0"><b>Emin Tech uygulamasını ana ekranına ekle</b><div class="small muted">${isIOS?'iPhone: Safari ➜ Paylaş '+SHARE_IC+' ➜ Ana Ekrana Ekle':'Tek dokunuşla kur, uygulama gibi tam ekran aç.'}</div></div><span class="btn sm pri">Ekle</span></div>`:''}
  <div class="row" style="margin:14px 0 8px"><input type="search" placeholder="🔍 Ürün veya model ara…" value="${esc(f.q)}" oninput="App.setF('q',this.value,true)" style="flex:1"></div>
  <div class="chips">${['',...CATS.filter(c=>c!=='Yedek Parça')].map((c,i)=>`<button class="chipb ${f.cat===c?'on':''}" onclick="App.setCat(${i})">${c?CAT_IC[c]+' '+esc(c):'Tümü'}</button>`).join('')}</div>
  <div id="vgrid"></div>`}
function vitrinGrid(){const f=UI.filters,q=lc(f.q);
  let ps=S.products.filter(p=>p.online!==false&&p.category!=='Yedek Parça');
  if(f.model)ps=ps.filter(p=>!(p.models||[]).length||p.models.includes(f.model));
  if(f.cat)ps=ps.filter(p=>p.category===f.cat);
  if(q)ps=ps.filter(p=>lc(p.name+' '+(p.models||[]).join(' ')+' '+p.brand+' '+p.category).includes(q));
  ps.sort((a,b)=>(b.stock>0)-(a.stock>0));
  let ds=S.devices.filter(d=>d.online!==false&&d.status==='Stokta');
  if(f.model)ds=ds.filter(d=>d.model===f.model);
  if(q)ds=ds.filter(d=>lc(devName(d)+' '+d.color).includes(q));
  if(f.cat)ds=[];
  let h='';
  if(ds.length)h+=`<h2 class="sec">📱 Telefonlar <span class="tag">${ds.length}</span></h2><div class="grid g3">${ds.map(devCard).join('')}</div>`;
  h+=`<h2 class="sec">🛍️ ${f.model?esc(f.model)+' için ':''}Aksesuarlar <span class="tag">${ps.length}</span></h2>`;
  h+=ps.length?`<div class="grid g2">${ps.map(prodCard).join('')}</div>`:`<div class="card empty"><div class="e">🔍</div>Bu filtreye uygun ürün yok.<br><span class="small">Aradığın ürünü WhatsApp'tan sorabilirsin, hemen tedarik edelim.</span>${S.settings.whatsapp?`<div style="margin-top:12px"><a class="btn wa" target="_blank" rel="noopener" href="${waLink(S.settings.whatsapp,'Merhaba, '+(f.model||'')+' için '+(f.q||f.cat||'aksesuar')+' var mı?')}">WhatsApp'tan Sor</a></div>`:''}</div>`;
  $('#vgrid').innerHTML=h}
function prodCard(p){const inC=cartQty('p',p.id);
  return `<div class="card pc"><div class="img">${imgOr(p.photo,CAT_IC[p.category]||'📦')}</div><div class="bd"><span class="small muted">${esc(p.category)}</span><div class="nm">${esc(p.name)}</div>${(p.models||[]).length?`<div class="small muted">Uyumlu: ${esc(p.models.join(', '))}</div>`:'<div class="small muted">Tüm modellerle uyumlu</div>'}
  <div class="row" style="justify-content:space-between;margin-top:auto"><span class="price">${TL(p.price)}</span>${stockTag(p)}</div>
  <button class="btn sm ${p.stock>0?'pri':''}" ${p.stock>0?'':'disabled'} onclick="App.addCart('p','${p.id}')">${p.stock>0?(inC?`Sepette (${inC}) · +1`:'Sepete Ekle'):'Tükendi'}</button></div></div>`}
function devCard(d){const inC=cartQty('d',d.id);
  return `<div class="card dc"><div class="img">${imgOr((d.photos||[])[0],'📱')}</div><div class="col" style="flex:1;min-width:0"><div class="row"><span class="tag ${d.condition==='Sıfır'?'blue':'acc'}">${esc(d.condition)}</span><span class="tag">🛡️ ${esc(d.warrantyMonths)} ay garanti</span></div>
  <div class="nm">${esc(devName(d))}</div><div class="small muted">${esc(d.color||'')}</div>
  ${d.condition!=='Sıfır'?`<div class="small">🔋 Pil sağlığı <b>%${esc(d.battery)}</b></div><div class="bar"><i style="width:${Math.min(100,+d.battery||0)}%;background:${d.battery>=85?'var(--ok)':d.battery>=78?'var(--warn)':'var(--bad)'}"></i></div>`:''}
  ${d.cosmetic?`<div class="small muted">${esc(d.cosmetic)}</div>`:''}
  <div class="row" style="justify-content:space-between;margin-top:auto"><span class="price">${TL(d.price)}</span><button class="btn sm ${inC?'':'pri'}" ${inC?'disabled':''} onclick="App.addCart('d','${d.id}')">${inC?'Sepette':'Rezerve Et'}</button></div></div></div>`}
function addCart(t,id){
  if(t==='p'){const p=P(id);if(!p)return;const c=S.cart.find(x=>x.t==='p'&&x.id===id);const q=c?c.qty:0;if(q+1>p.stock)return toast('Stokta bu kadar yok','bad');c?c.qty++:S.cart.push({t,id,qty:1})}
  else{const d=D(id);if(!d||d.status!=='Stokta')return toast('Cihaz artık müsait değil','bad');if(!S.cart.find(x=>x.t==='d'&&x.id===id))S.cart.push({t,id,qty:1})}
  save();toast('Sepete eklendi ✓','ok');if(UI.view==='vitrin')vitrinGrid();renderNav()}
function cartLines(){return S.cart.map(c=>{if(c.t==='p'){const p=P(c.id);return p?{c,name:p.name,sub:(p.models||[]).join(', '),price:p.price,max:p.stock,ic:CAT_IC[p.category],img:p.photo}:null}const d=D(c.id);return d&&d.status==='Stokta'?{c,name:devName(d),sub:d.condition+' · '+(d.color||''),price:d.price,max:1,ic:'📱',img:(d.photos||[])[0]}:null}).filter(Boolean)}
function vSepet(){const L=cartLines();if(L.length!==S.cart.length){S.cart=L.map(l=>l.c);save()}
  if(!L.length)return `<h1 class="t" style="margin-bottom:14px">Sepetim</h1><div class="card empty"><div class="e">🛒</div>Sepetin boş.<div style="margin-top:12px"><button class="btn pri" onclick="App.go('vitrin')">Vitrine Göz At</button></div></div>`;
  const total=sumBy(L,l=>l.price*l.c.qty);
  return `<h1 class="t" style="margin-bottom:14px">Sepetim</h1><div class="kasa"><div class="card list">${L.map((l,i)=>`<div class="it"><div class="thumb">${imgOr(l.img,l.ic)}</div><div class="grow"><div class="nm">${esc(l.name)}</div><div class="small muted">${esc(l.sub)}</div><div class="b">${TL(l.price)}</div></div><div class="qty">${l.c.t==='p'?`<button onclick="App.cartQ(${i},-1)" aria-label="Azalt">−</button><b>${l.c.qty}</b><button onclick="App.cartQ(${i},1)" aria-label="Arttır">+</button>`:''}<button onclick="App.cartQ(${i},-99)" aria-label="Kaldır">🗑</button></div></div>`).join('')}</div>
  <div class="card sticky"><form id="mform" onsubmit="return false">
  <div class="tot big" style="border:0;margin:0;padding-top:0"><span>Toplam</span><span>${TL(total)}</span></div>
  <p class="small muted" style="margin:4px 0 12px">Bu siparişten <b class="accc">${Math.floor(total*S.settings.pointRate/100)} puan</b> kazanırsın.</p>
  ${F('Ad Soyad','name','','text','autocomplete="name" required')}${F('Cep telefonu','phone','','tel','autocomplete="tel" inputmode="tel" placeholder="05xx xxx xx xx"')}
  <div class="seg" style="margin-bottom:12px" id="dlv"><button type="button" class="on" onclick="App.dlv(this,0)">🏪 Mağazadan Teslim Al</button><button type="button" onclick="App.dlv(this,1)">🚚 Kargo ile</button></div>
  <input type="hidden" name="delivery" value="Mağazadan Teslim">
  <div id="addr" hidden>${TA('Teslimat adresi','address','')}</div>
  ${TA('Not (isteğe bağlı)','note','')}
  <p class="small muted" style="margin-bottom:12px">Ödeme: mağazada nakit/kart. Kargo siparişlerinde ödeme bilgisi WhatsApp'tan iletilir. Ürünler siparişinle birlikte senin için ayrılır.</p>
  <button class="btn pri w" onclick="App.placeOrder()">Siparişi Gönder</button></form></div></div>`}
function dlv(btn,i){btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');$('#mform [name=delivery]').value=i?'Kargo':'Mağazadan Teslim';$('#addr').hidden=!i}
function cartQ(i,d){const c=S.cart[i];if(!c)return;if(d===-99||c.qty+d<=0)S.cart.splice(i,1);else{if(c.t==='p'){const p=P(c.id);if(c.qty+d>p.stock)return toast('Stokta bu kadar yok','bad')}c.qty+=d}save();render()}
function placeOrder(){const f=formData();const L=cartLines();if(!L.length)return;
  if(!f.name||f.name.trim().length<3)return toast('Lütfen adını soyadını yaz','bad');
  if(normPhone(f.phone).length!==10)return toast('Geçerli bir cep telefonu yaz (05xx…)','bad');
  if(f.delivery==='Kargo'&&(!f.address||f.address.trim().length<10))return toast('Kargo için açık adres gerekli','bad');
  for(const l of L){if(l.c.t==='p'&&l.c.qty>P(l.c.id).stock)return toast(l.name+' stokta kalmadı','bad')}
  const items=L.map(l=>{if(l.c.t==='p'){const p=P(l.c.id);p.stock-=l.c.qty;return{t:'p',id:p.id,name:p.name,cat:p.category,qty:l.c.qty,price:p.price,cost:p.cost}}const d=D(l.c.id);d.status='Rezerve';d.reservedFor=f.name.trim()+' · '+fmtPhone(f.phone);return{t:'d',id:d.id,name:devName(d),cat:'Telefon',qty:1,price:d.price,cost:devCost(d)}});
  const o={id:uid(),no:'S-'+(++S.seq.order),at:now(),name:f.name.trim(),phone:normPhone(f.phone),delivery:f.delivery,address:f.address||'',note:f.note||'',items,total:sumBy(items,i=>i.price*i.qty),status:'Yeni'};
  S.orders.unshift(o);S.cart=[];upsertCustomer(o.name,o.phone);save();render();
  const msg=`Merhaba, ${o.no} numaralı siparişimi oluşturdum.\n${o.items.map(i=>`• ${i.qty} x ${i.name} – ${TL(i.price*i.qty)}`).join('\n')}\nToplam: ${TL(o.total)}\nTeslimat: ${o.delivery}${o.address?'\nAdres: '+o.address:''}\n${o.name} – ${fmtPhone(o.phone)}`;
  modal('Siparişin alındı 🎉',`<div class="empty" style="padding:10px"><div class="e">✅</div><h3>Sipariş No: ${esc(o.no)}</h3><p class="muted" style="margin-top:6px">${o.delivery==='Kargo'?'Ödeme ve kargo bilgisi için seninle iletişime geçeceğiz.':'Ürünlerin ayrıldı. Hazır olduğunda haber vereceğiz; mağazaya uğrayıp beklemeden teslim alabilirsin.'}</p></div>`,
  (S.settings.whatsapp?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(S.settings.whatsapp,msg)}">WhatsApp ile Bildir</a>`:'')+`<button class="btn pri" onclick="App.close()">Tamam</button>`)}

function vTakip(){const m=UI.trkMode||'kod';return `<h1 class="t" style="margin-bottom:6px">Tamir Takip</h1><p class="muted" style="margin-bottom:14px">Cihazının durumunu takip kodu veya telefon numaranla sorgula.</p>
  <div class="card" style="max-width:520px"><div class="seg" style="margin-bottom:12px"><button class="${m==='kod'?'on':''}" onclick="App.trkMode('kod')">Takip kodu ile</button><button class="${m==='tel'?'on':''}" onclick="App.trkMode('tel')">Telefon numarası ile</button></div>
  <form id="mform" onsubmit="App.track();return false">${m==='kod'?`<div class="fg">${F('Takip kodu','code','','text','placeholder="ET-1001" autocapitalize="characters"')}${F('Telefon son 4 hane','last4','','text','inputmode="numeric" maxlength="4" placeholder="0001"')}</div>`:F('Cep telefonu','tphone','','tel','inputmode="tel" placeholder="05xx xxx xx xx"')}<button class="btn pri w">Durumu Sorgula</button></form></div><div id="trk" style="max-width:640px;margin-top:14px"></div>`}
function track(){const f=formData();
  if((UI.trkMode||'kod')==='tel'){const k=normPhone(f.tphone);if(k.length!==10){$('#trk').innerHTML='<div class="alert bad">Geçerli bir cep telefonu yaz.</div>';return}
    const rs=S.repairs.filter(r=>normPhone(r.customer.phone)===k&&(r.status<6||(r.deliveredAt&&r.deliveredAt>addDays(now(),-30)))).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    if(!rs.length){$('#trk').innerHTML='<div class="alert bad">Bu numaraya kayıtlı aktif servis kaydı bulunamadı.</div>';return}
    if(rs.length===1){UI.trackId=rs[0].id;drawTrack();return}
    UI.trackId=null;$('#trk').innerHTML=`<div class="card list">${rs.map(r=>`<div class="it click" onclick="App.trackPick('${r.id}')"><div class="thumb">🔧</div><div class="grow"><div class="nm">${esc(r.code)} · ${esc(r.brand+' '+r.model)}</div><div class="small muted">${dt(r.createdAt)}</div></div><span class="tag ${r.status>=5?'ok':'acc'}">${esc(STEPS[r.status])}</span></div>`).join('')}</div>`;return}
  const code=String(f.code||'').trim().toUpperCase().replace(/^ET(\d)/,'ET-$1');const l4=digits(f.last4);
  const r=S.repairs.find(x=>x.code.toUpperCase()===code&&normPhone(x.customer.phone).slice(-4)===l4);
  if(!r){$('#trk').innerHTML=`<div class="alert bad">Kayıt bulunamadı. Kodu ve telefon numaranın son 4 hanesini kontrol et.</div>`;return}
  UI.trackId=r.id;drawTrack()}
function drawTrack(){const r=R(UI.trackId);if(!r||!$('#trk'))return;const t=repTotals(r);
  const tl=STEPS.map((s,i)=>{const h=[...r.history].reverse().find(x=>x.s===s);const cls=i<r.status?'done':i===r.status?(r.status===6?'done':'cur'):'';return `<li class="${cls}"><span class="dot"></span>${esc(s)}${h&&i<=r.status?`<div class="small muted">${dt(h.at)}</div>`:''}</li>`}).join('');
  $('#trk').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="small muted">${esc(r.code)}</div><h3>${esc(r.brand+' '+r.model)}</h3></div><span class="tag ${r.status>=5?'ok':'acc'}">${esc(STEPS[r.status])}</span></div>
  <div class="stepper">${STEPS.slice(0,6).map((s,i)=>`<i class="${i<r.status?'on':i===r.status?'cur':''}"></i>`).join('')}</div>
  ${r.extra&&r.extra.state==='bekliyor'?`<div class="alert"><b>⚠️ Onayınız gerekiyor</b><p style="margin:6px 0">${esc(r.extra.desc)}</p><p class="b">Ek ücret: ${TL(r.extra.amount)}</p><div class="row" style="margin-top:10px"><button class="btn pri" onclick="App.approve(true)">✓ Onaylıyorum</button><button class="btn bad" onclick="App.approve(false)">✕ Onaylamıyorum</button></div></div>`:''}
  ${r.extra&&r.extra.state!=='bekliyor'?`<div class="alert ${r.extra.state==='onaylandı'?'ok':'bad'} small">Ek işlem (${esc(r.extra.desc)}) – <b>${esc(r.extra.state)}</b></div>`:''}
  <ul class="tl" style="margin-top:14px">${tl}</ul>
  <hr class="s"><div class="tot"><span class="muted">Arıza</span><span>${esc(r.issue)}</span></div>
  <div class="tot"><span class="muted">${r.status>=5?'Toplam tutar':'Tahmini ücret'}</span><b>${TL(r.status>=5&&t.total?t.total:r.estimate)}</b></div>${r.deposit&&r.deposit.amount?`<div class="tot"><span class="muted">Ödenen kapora</span><span>−${TL(r.deposit.amount)}</span></div>`:''}
  ${r.due&&r.status<6?`<div class="tot"><span class="muted">Tahmini teslim</span><span>${dOnly(r.due)}</span></div>`:''}
  ${r.status===6&&r.warrantyUntil?`<div class="alert ok small">🛡️ İşçilik ve parça garantisi <b>${dOnly(r.warrantyUntil)}</b> tarihine kadar geçerli.</div>`:''}
  ${S.settings.whatsapp?`<a class="btn wa w" style="margin-top:12px" target="_blank" rel="noopener" href="${waLink(S.settings.whatsapp,'Merhaba, '+r.code+' kodlu cihazım hakkında bilgi almak istiyorum.')}">WhatsApp ile Sor</a>`:''}</div>`}
function approve(yes){const r=R(UI.trackId);if(!r||!r.extra||r.extra.state!=='bekliyor')return;r.extra.state=yes?'onaylandı':'reddedildi';r.extra.at=now();r.extra.seen=false;r.history.push({s:'Müşteri ek işlemi '+(yes?'onayladı':'reddetti'),at:now()});save();drawTrack();renderNav();toast(yes?'Onayınız iletildi, teşekkürler!':'Yanıtınız iletildi','ok')}

function vCuzdan(){return `<h1 class="t" style="margin-bottom:6px">Dijital Cüzdanım</h1><p class="muted" style="margin-bottom:14px">Faturaların, garanti belgelerin ve puanların tek yerde. Kayıtlı telefon numaranla görüntüle.</p>
  <div class="card" style="max-width:520px"><form id="mform" onsubmit="App.wallet();return false">${F('Cep telefonu','phone',UI.walletPhone,'tel','inputmode="tel" placeholder="05xx xxx xx xx"')}<button class="btn pri w">Cüzdanımı Aç</button></form></div><div id="wal" style="margin-top:14px"></div>`}
function wallet(){const f=formData();UI.walletPhone=f.phone||'';drawWallet()}
function drawWallet(){const k=normPhone(UI.walletPhone);const el=$('#wal');if(!el)return;if(k.length!==10){el.innerHTML='<div class="alert bad">Geçerli bir numara yaz.</div>';return}
  const c=S.customers[k];const sales=S.sales.filter(s=>s.phone===k).sort((a,b)=>b.at.localeCompare(a.at));const reps=S.repairs.filter(r=>normPhone(r.customer.phone)===k);
  const devs=S.devices.filter(d=>d.status==='Satıldı'&&normPhone(d.buyerPhone)===k);
  if(!c&&!sales.length&&!reps.length){el.innerHTML='<div class="card empty"><div class="e">💳</div>Bu numaraya kayıtlı işlem bulunamadı.</div>';return}
  el.innerHTML=`<div class="kpis"><div class="card kpi hl"><div class="l">Puan bakiyesi</div><div class="v accc">${c?c.points:0} puan</div><div class="small muted">1 puan = 1 ₺ indirim</div></div>${c&&c.balance>0?`<div class="card kpi"><div class="l">Açık hesap (veresiye)</div><div class="v warnc">${TL(c.balance)}</div></div>`:''}<div class="card kpi"><div class="l">Toplam alışveriş</div><div class="v">${TL(sumBy(sales,s=>s.total))}</div></div><div class="card kpi"><div class="l">Servis kaydı</div><div class="v">${reps.length}</div></div></div>
  ${devs.length?`<h2 class="sec">🛡️ Telefon garantilerim</h2><div class="card list">${devs.map(d=>{const until=addMonths(d.soldAt,+d.warrantyMonths||0);const ok=until>now();return `<div class="it"><div class="thumb">📱</div><div class="grow"><div class="nm">${esc(devName(d))}</div><div class="small muted">IMEI ${esc(d.imei)}</div></div><span class="tag ${ok?'ok':'bad'}">${ok?'Garanti: '+dOnly(until):'Garanti bitti'}</span></div>`}).join('')}</div>`:''}
  ${reps.length?`<h2 class="sec">🔧 Servis kayıtlarım</h2><div class="card list">${reps.map(r=>`<div class="it"><div class="thumb">🔧</div><div class="grow"><div class="nm">${esc(r.brand+' '+r.model)} <span class="small muted">${esc(r.code)}</span></div><div class="small muted">${esc(r.issue)}</div></div><span class="tag ${r.status===6?(r.warrantyUntil>now()?'ok':''):'acc'}">${r.status===6?(r.warrantyUntil>now()?'Garanti: '+dOnly(r.warrantyUntil):'Teslim edildi'):esc(STEPS[r.status])}</span></div>`).join('')}</div>`:''}
  ${sales.length?`<h2 class="sec">🧾 Faturalarım / Fişlerim</h2><div class="card list">${sales.map(s=>`<div class="it click" onclick="App.receipt('${s.id}')"><div class="thumb">🧾</div><div class="grow"><div class="nm">${esc(s.no)} · ${TL(s.total)}</div><div class="small muted">${dt(s.at)} · ${esc(s.items.map(i=>i.name).join(', ')).slice(0,80)}</div></div><span class="muted">›</span></div>`).join('')}</div>`:''}`}

  const open=S.repairs.filter(r=>r.status<5),ready=S.repairs.filter(r=>r.status===5),low=S.products.filter(p=>p.stock<=p.min),newO=S.orders.filter(o=>o.status==='Yeni');

  <div class="kpis"><div class="card kpi hl"><div class="l">Bugünkü ciro</div><div class="v">${TL(rev)}</div><div class="small muted">${ss.length} işlem · net kasa ${TL(cash)}</div></div><div class="card kpi"><div class="l">Bugünkü net kâr</div><div class="v okc">${TL(prof)}</div></div><div class="card kpi click" onclick="App.go('tamir')" style="cursor:pointer"><div class="l">Açık tamir</div><div class="v">${open.length}</div><div class="small muted">${ready.length} hazır bekliyor</div></div><div class="card kpi" onclick="App.go('stok')" style="cursor:pointer"><div class="l">Kritik stok</div><div class="v ${low.length?'warnc':''}">${low.length}</div></div><div class="card kpi" onclick="App.go('siparisler')" style="cursor:pointer"><div class="l">Yeni online sipariş</div><div class="v ${newO.length?'accc':''}">${newO.length}</div></div><div class="card kpi" onclick="App.go('randevu')" style="cursor:pointer"><div class="l">Bugünkü randevu</div><div class="v">${S.appointments.filter(a=>a.date===ymd(now())&&a.status!=='İptal').length}</div><div class="small muted">${S.appointments.filter(a=>a.status==='Bekliyor').length} onay bekliyor</div></div><div class="card kpi" onclick="App.go('musteriler')" style="cursor:pointer"><div class="l">Veresiye alacak</div><div class="v ${totalDebt()?'warnc':''}">${TL(totalDebt())}</div></div></div>
  <div class="row" style="margin-bottom:6px"><button class="btn pri" onclick="App.repForm()">＋ Yeni Tamir Kaydı</button><button class="btn" onclick="App.go('kasa')">🧾 Hızlı Satış</button><button class="btn" onclick="App.devForm()">📱 Cihaz Alımı</button><button class="btn" onclick="App.swap()">⇄ Takas</button><button class="btn" onclick="App.prodForm()">📦 Ürün Ekle</button><button class="btn" onclick="App.qForm()">📝 Teklif</button><button class="btn" onclick="App.apForm()">📅 Randevu</button><button class="btn" onclick="App.go('gelirgider')">💸 Gider Ekle</button></div>
  ${answered.length?`<div class="alert ok"><b>📩 Müşteri yanıtları:</b> ${answered.map(r=>`<a href="javascript:void 0" onclick="App.rep('${r.id}')">${esc(r.code)} (${esc(r.extra.state)})</a>`).join(', ')}</div>`:''}
  ${late.length?`<div class="alert bad"><b>⏰ Teslim tarihi geçen ${late.length} tamir var:</b> ${late.map(r=>`<a href="javascript:void 0" onclick="App.rep('${r.id}')">${esc(r.code)}</a>`).join(', ')}</div>`:''}
  <div class="grid g3" style="margin-top:8px">
   <div class="card"><h3>✅ Teslime hazır</h3><div class="list">${ready.map(repRow).join('')||'<div class="empty small">Hazır cihaz yok</div>'}</div></div>
   <div class="card"><h3>⏳ Müşteri onayı bekleyen</h3><div class="list">${pend.map(repRow).join('')||'<div class="empty small">Bekleyen onay yok</div>'}</div></div>
   <div class="card"><div class="row"><h3 style="flex:1">📉 Kritik stok</h3><button class="btn sm" onclick="App.supplierList()">Toptancı Listesi</button></div><div class="list">${low.slice(0,6).map(p=>`<div class="it"><div class="thumb">${CAT_IC[p.category]}</div><div class="grow"><div class="nm">${esc(p.name)}</div><div class="small muted">${esc((p.models||[]).join(', ')||'Genel')}</div></div><span class="tag ${p.stock<=0?'bad':'warn'}">${p.stock} adet</span></div>`).join('')||'<div class="empty small">Tüm stoklar yeterli 👍</div>'}</div></div>
   <div class="card"><h3>📲 Emanet (ikame) cihazlar</h3><div class="list">${loans.map(r=>`<div class="it click" onclick="App.rep('${r.id}')"><div class="thumb">📲</div><div class="grow"><div class="nm">${esc(r.loaner.desc)}</div><div class="small muted">${esc(r.customer.name)} · iade ${dOnly(r.loaner.due)}</div></div>${r.loaner.due&&r.loaner.due<now()?'<span class="tag bad">Gecikti</span>':''}</div>`).join('')||'<div class="empty small">Dışarıda emanet cihaz yok</div>'}</div></div>
   <div class="card"><h3>🛒 Yeni online siparişler</h3><div class="list">${newO.map(o=>`<div class="it click" onclick="App.go('siparisler')"><div class="thumb">🛒</div><div class="grow"><div class="nm">${esc(o.no)} · ${esc(o.name)}</div><div class="small muted">${esc(o.delivery)} · ${TL(o.total)}</div></div></div>`).join('')||'<div class="empty small">Yeni sipariş yok</div>'}</div></div>
   <div class="card"><h3>🔧 Devam eden tamirler</h3><div class="list">${open.slice(0,6).map(repRow).join('')||'<div class="empty small">Açık tamir yok</div>'}</div></div>
  </div>`}

/* --- Toptancı listesi --- */
function supplierList(){const low=S.products.filter(p=>p.stock<=p.min);if(!low.length)return toast('Kritik stokta ürün yok 👍','ok');
  const by={};low.forEach(p=>{(by[p.supplier||'Toptancı']=by[p.supplier||'Toptancı']||[]).push(p)});
  const txt=Object.entries(by).map(([s,ps])=>`*${s}*\n`+ps.map(p=>`• ${p.name}${(p.models||[]).length?' ('+p.models.join('/')+')':''} – ${Math.max(p.min*2-p.stock,1)} adet`).join('\n')).join('\n\n');
  modal('📋 Toptancıya Verilecek Sipariş Listesi',`<p class="small muted" style="margin-bottom:10px">Kritik eşiğin altına düşen ürünler, tedarikçiye göre gruplandı. Önerilen miktar = eşik × 2 − mevcut.</p><textarea id="suptxt" style="min-height:220px">${esc(`${S.settings.shopName} – Sipariş Listesi (${dOnly(now())})\n\n`+txt)}</textarea>`,
  `<button class="btn" onclick="App.copy($('#suptxt').value)">Kopyala</button><a class="btn wa" target="_blank" rel="noopener" href="${waLink('',`${S.settings.shopName} – Sipariş Listesi\n\n`+txt)}">WhatsApp'ta Paylaş</a>`)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('Kopyalandı ✓','ok'),()=>toast('Kopyalanamadı, metni seçip kopyalayın','bad'))}catch(e){toast('Kopyalanamadı','bad')}}

/* --- Kasa --- */
function vKasa(){return `<div class="hdr"><h1 class="t">Kasa</h1><span class="sp"></span><button class="btn sm" onclick="App.posFree()">＋ Serbest kalem</button></div>
  <div class="kasa"><div><div class="card"><div class="row" style="flex-wrap:nowrap"><input id="posq" type="search" style="flex:1" placeholder="🔍 Barkod okut / ürün adı / IMEI (Enter)" autocomplete="off" oninput="App.posSearch()" onkeydown="if(event.key==='Enter'){event.preventDefault();App.posEnter()}"><button class="btn" onclick="App.scanPos()" aria-label="Kamerayla barkod okut" title="Kamerayla barkod okut">📷</button></div><div id="posres" class="list" style="margin-top:6px"></div></div><div id="posx"></div></div>
  <div class="card sticky" id="poscart"></div></div>`}
function posResults(q){q=lc(q.trim());let ps=S.products.filter(p=>p.stock>0),ds=S.devices.filter(d=>d.status==='Stokta'||d.status==='Rezerve');
  if(q){ps=ps.filter(p=>lc(p.name+' '+p.barcode+' '+(p.models||[]).join(' ')+' '+p.category).includes(q));ds=ds.filter(d=>lc(devName(d)+' '+d.imei+' '+d.imei2).includes(q))}else{ps=ps.slice().sort((a,b)=>b.stock-a.stock).slice(0,8);ds=[]}
  return{ps:ps.slice(0,10),ds:ds.slice(0,6)}}
function posSearch(){const q=$('#posq').value;const {ps,ds}=posResults(q);
  $('#posres').innerHTML=(q?'':'<div class="small muted" style="padding:6px 2px">Hızlı ekle</div>')+ds.map(d=>`<div class="it click" onclick="App.posAdd('d','${d.id}')"><div class="thumb">📱</div><div class="grow"><div class="nm">${esc(devName(d))}</div><div class="small muted">IMEI ${esc(d.imei)} · ${esc(d.status)}</div></div><b>${TL(d.price)}</b></div>`).join('')+ps.map(p=>`<div class="it click" onclick="App.posAdd('p','${p.id}')"><div class="thumb">${imgOr(p.photo,CAT_IC[p.category])}</div><div class="grow"><div class="nm">${esc(p.name)}</div><div class="small muted">${esc((p.models||[]).join(', ')||p.category)} · ${p.stock} adet · Raf ${esc(p.shelf||'-')}</div></div><b>${TL(p.price)}</b></div>`).join('')||'<div class="empty small">Sonuç yok</div>'}
function posEnter(){const q=$('#posq').value.trim();if(!q)return;const p=S.products.find(x=>x.barcode&&x.barcode.toLowerCase()===q.toLowerCase());if(p){posAdd('p',p.id);return}
  const d=S.devices.find(x=>(x.imei===digits(q)||x.imei2===digits(q))&&x.status!=='Satıldı');if(d){posAdd('d',d.id);return}
  const {ps,ds}=posResults(q);if(ps.length+ds.length===1){ps.length?posAdd('p',ps[0].id):posAdd('d',ds[0].id)}else toast(ps.length+ds.length?'Birden fazla sonuç, listeden seçin':'Ürün bulunamadı','bad')}
function posAdd(t,id){const it=UI.pos.items;
  if(t==='p'){const p=P(id);const ex=it.find(x=>x.t==='p'&&x.id===id);if((ex?ex.qty:0)+1>p.stock)return toast('Stok yetersiz','bad');if(ex)ex.qty++;else it.push({t,id,name:p.name,cat:p.category,qty:1,price:p.price,cost:p.cost})}
  else{const d=D(id);if(it.find(x=>x.t==='d'&&x.id===id))return toast('Cihaz zaten sepette','bad');if(d.status==='Rezerve')toast('Not: bu cihaz rezerve – '+(d.reservedFor||''),'');it.push({t,id,name:devName(d)+' (IMEI '+d.imei+')',cat:'Telefon',qty:1,price:d.price,cost:devCost(d)})}
  const q=$('#posq');if(q){q.value='';q.focus()}posSearch();drawCart()}
function posFree(){modal('Serbest Kalem',`<form id="mform" onsubmit="return false"><p class="small muted" style="margin-bottom:10px">Yazılım yükleme, veri aktarma, kurulum gibi stoksuz hizmetler için.</p>${F('Açıklama','name','','text','placeholder="Örn: Veri aktarımı"')}<div class="fg">${F('Satış fiyatı (₺)','price','','number','inputmode="decimal"')}${F('Maliyet (₺)','cost','0','number','inputmode="decimal"')}</div></form>`,`<button class="btn pri" onclick="App.posFreeAdd()">Ekle</button>`)}
function posFreeAdd(){const f=formData();if(!f.name||num(f.price)<=0)return toast('Açıklama ve fiyat gerekli','bad');UI.pos.items.push({t:'f',id:uid(),name:f.name,cat:'Hizmet',qty:1,price:num(f.price),cost:num(f.cost)});close();drawCart()}
function crossSell(){const it=UI.pos.items;if(!it.length)return'';const models=new Set(),cats=new Set(it.map(i=>i.cat));
  it.forEach(i=>{if(i.t==='d'){const d=D(i.id);d&&models.add(d.model)}if(i.t==='p'){const p=P(i.id);p&&(p.models||[]).forEach(m=>models.add(m))}});
  if(!models.size)return'';const want=['Kılıf','Ekran Koruyucu','Kamera Koruyucu'].filter(c=>!cats.has(c));
  const sug=S.products.filter(p=>p.stock>0&&want.includes(p.category)&&(p.models||[]).some(m=>models.has(m))&&!it.find(x=>x.id===p.id)).slice(0,4);
  if(!sug.length)return'';const hasDev=it.some(i=>i.t==='d');
  return `<div class="card" style="margin-top:12px;border-color:rgba(201,206,214,.45)"><b>💡 ${hasDev?'Yeni telefona koruma paketi önerin':'Bunu alanlar genellikle şunları da alıyor'}</b><div class="list">${sug.map(p=>`<div class="it"><div class="thumb">${CAT_IC[p.category]}</div><div class="grow"><div class="nm">${esc(p.name)}</div><div class="small muted">${esc(p.models.join(', '))}</div></div><b>${TL(p.price)}</b><button class="btn sm blue" onclick="App.posAdd('p','${p.id}')">Ekle</button></div>`).join('')}</div></div>`}
function posCalc(){const p=UI.pos,sub=sumBy(p.items,i=>i.price*i.qty),disc=Math.min(Math.max(num(p.discount),0),sub);const c=S.customers[normPhone(p.phone)];const pts=p.usePoints&&c?Math.min(c.points,sub-disc):0;const total=sub-disc-pts;return{sub,disc,pts,total,cost:sumBy(p.items,i=>i.cost*i.qty),c,earned:Math.floor(total*S.settings.pointRate/100)}}
function drawCart(){const el=$('#poscart');if(!el)return;const p=UI.pos,k=posCalc();
  el.innerHTML=`<div class="row"><h3 style="flex:1">Satış Sepeti</h3>${p.items.length?'<button class="btn sm ghost" onclick="App.posClear()">Temizle</button>':''}</div>
  ${p.items.length?`<div class="list">${p.items.map((i,x)=>`<div class="it"><div class="grow"><div class="nm">${esc(i.name)}</div><div class="row small muted">Birim <input style="width:110px;padding:6px 8px;font-size:14px" inputmode="decimal" value="${i.price}" onchange="App.posPrice(${x},this.value)" aria-label="Birim fiyat"> · Kâr ${TL((i.price-i.cost)*i.qty)}</div></div><div class="qty">${i.t==='p'?`<button onclick="App.posQ(${x},-1)">−</button><b>${i.qty}</b><button onclick="App.posQ(${x},1)">+</button>`:`<button onclick="App.posQ(${x},-99)" aria-label="Kaldır">🗑</button>`}</div></div>`).join('')}</div>`:'<div class="empty small">Barkod okutun veya listeden ürün seçin</div>'}
  <hr class="s"><div class="fg">${''}<label class="f"><span>Müşteri tel (puan için)</span><input type="tel" inputmode="tel" value="${esc(p.phone)}" onchange="App.posSet('phone',this.value)" placeholder="05xx…"></label><label class="f"><span>Müşteri adı</span><input value="${esc(p.name)}" onchange="App.posSet('name',this.value)"></label></div>
  ${k.c?`<label class="check"><input type="checkbox" ${p.usePoints?'checked':''} onchange="App.posSet('usePoints',this.checked)"> ${esc(k.c.name||'Müşteri')} – <b class="accc">${k.c.points} puan</b> kullan</label>`:''}
  <label class="f"><span>İndirim (₺)</span><input inputmode="decimal" value="${p.discount||''}" onchange="App.posSet('discount',this.value)" placeholder="0"></label>
  <div class="seg" style="margin-bottom:10px">${PAYS_V.map(x=>`<button class="${p.pay===x?'on':''}" onclick="App.posSet('pay','${x}')">${x}</button>`).join('')}</div>
  <div class="tot"><span class="muted">Ara toplam</span><span>${TL(k.sub)}</span></div>${k.disc?`<div class="tot"><span class="muted">İndirim</span><span>−${TL(k.disc)}</span></div>`:''}${k.pts?`<div class="tot"><span class="muted">Puan</span><span>−${TL(k.pts)}</span></div>`:''}
  <div class="tot big"><span>Toplam</span><span>${TL(k.total)}</span></div><div class="tot small"><span class="muted">Net kâr</span><span class="okc b">${TL(k.total-k.cost)}</span></div>
  <button class="btn pri w" style="margin-top:10px;min-height:52px;font-size:16px" ${p.items.length?'':'disabled'} onclick="App.posDone()">✓ Satışı Tamamla (${esc(p.pay)})</button>`;
  const x=$('#posx');if(x)x.innerHTML=crossSell()}
function posQ(x,d){const i=UI.pos.items[x];if(!i)return;if(d===-99||i.qty+d<=0)UI.pos.items.splice(x,1);else{if(i.t==='p'&&i.qty+d>P(i.id).stock)return toast('Stok yetersiz','bad');i.qty+=d}drawCart()}
function posPrice(x,v){const i=UI.pos.items[x];if(i){i.price=Math.max(0,num(v));drawCart()}}
function posSet(k,v){UI.pos[k]=v;drawCart()}
function posClear(){UI.pos={items:[],discount:0,phone:'',name:'',pay:'Nakit',usePoints:false};drawCart()}
function posDone(){const p=UI.pos,k=posCalc();if(!p.items.length)return;
  for(const i of p.items){if(i.t==='p'&&i.qty>P(i.id).stock)return toast(i.name+': stok yetersiz','bad');if(i.t==='d'&&D(i.id).status==='Satıldı')return toast('Cihaz zaten satılmış','bad')}
  if(p.phone&&normPhone(p.phone).length!==10)return toast('Telefon numarası geçersiz','bad');
  if(p.pay==='Veresiye'&&normPhone(p.phone).length!==10)return toast('Veresiye satış için müşteri telefonu ve adı gerekli','bad');
  const ph=normPhone(p.phone);
  const sale={id:uid(),no:nextSaleNo(),at:now(),kind:'pos',items:p.items.map(i=>({...i})),subtotal:k.sub,discount:k.disc,points:k.pts,total:k.total,cost:k.cost,pay:p.pay,phone:ph,name:p.name,earned:ph?k.earned:0};
  finalizeSale(sale);posClear();render();receipt(sale.id)}
function finalizeSale(sale){
  sale.items.forEach(i=>{if(i.t==='p'&&!sale.preDeducted){const pr=P(i.id);if(pr)pr.stock-=i.qty}if(i.t==='d'){const d=D(i.id);if(d){d.status='Satıldı';d.soldAt=sale.at;d.soldPrice=i.price;d.buyerName=sale.name;d.buyerPhone=sale.phone;d.saleId=sale.id}}});
  if(sale.phone){const c=upsertCustomer(sale.name,sale.phone);if(c){c.points=Math.max(0,c.points-(sale.points||0)+(sale.earned||0));if(sale.pay==='Veresiye')c.balance=(+c.balance||0)+(sale.collected??sale.total)}}
  S.sales.push(sale);save()}

  const used=f.condition!=='Sıfır';

function repDeliverDo(id){const r=R(id),f=formData(),t=repTotals(r);const disc=Math.min(num(f.disc),t.total);
  const items=[...r.parts.map(p=>({t:'rp',id:p.pid||uid(),name:p.name+(p.serial?' (SN '+p.serial+')':''),cat:'Teknik Servis',qty:1,price:p.price,cost:p.cost})),...(t.labor?[{t:'lab',id:uid(),name:'İşçilik – '+r.brand+' '+r.model,cat:'Teknik Servis',qty:1,price:t.labor,cost:0}]:[]),...(t.ext?[{t:'ext',id:uid(),name:'Ek işlem: '+r.extra.desc,cat:'Teknik Servis',qty:1,price:t.ext,cost:0}]:[])];
  r.status=6;r.deliveredAt=now();r.warrantyUntil=addDays(now(),+S.settings.repairWarrantyDays||90);r.lock.val='';if(r.loaner)r.loaner.returned=true;r.history.push({s:STEPS[6],at:now()});
  const dep=r.deposit?+r.deposit.amount||0:0;let refund=0;
  if(items.length&&t.total>0){const total=t.total-disc;refund=Math.max(0,dep-total);const sale={id:uid(),no:nextSaleNo(),at:now(),kind:'tamir',repairId:r.id,items,subtotal:t.total,discount:disc,points:0,total,cost:t.pcost,pay:f.pay,phone:r.customer.phone,name:r.customer.name,earned:Math.floor(total*S.settings.pointRate/100),preDeducted:true,deposit:dep,collected:Math.max(0,total-dep)};finalizeSale(sale);r.saleId=sale.id}else refund=dep;

  save();close();render();toast(refund>0?'Teslim edildi – müşteriye '+TL(refund)+' iade edin':'Teslim edildi ✓','ok');if(r.saleId)receipt(r.saleId)}

  modal('Tamirsiz İade – '+esc(r.code),`<form id="mform" onsubmit="return false"><p class="muted" style="margin-bottom:10px">Cihaz onarılmadan müşteriye iade edilecek (müşteri vazgeçti / onarım mümkün değil).</p>${F('Neden','why','')}${F('İnceleme ücreti (₺, yoksa 0)','fee','0','number','inputmode="decimal"')}${SEL('Ödeme','pay',PAYS_V,'Nakit')}${r.deposit&&r.deposit.amount?`<div class="alert info small">Alınan kapora: ${TL(r.deposit.amount)} – inceleme ücreti düşülüp kalanı iade edilir.</div>`:''}</form>`,`<button class="btn bad" onclick="App.repReturnDo('${id}')">İade Et</button>`)}
function repReturnDo(id){const r=R(id),f=formData(),fee=num(f.fee);r.status=6;r.deliveredAt=now();r.noRepair=true;r.lock.val='';if(r.loaner)r.loaner.returned=true;r.history.push({s:'Tamir edilmeden iade edildi'+(f.why?': '+f.why:''),at:now()});
  const dep=r.deposit?+r.deposit.amount||0:0;const refund=Math.max(0,dep-fee);

  if(refund>0){addPayment({kind:'iade',repairId:r.id,ref:r.code,phone:r.customer.phone,name:r.customer.name,amount:-refund,pay:r.deposit.pay});r.history.push({s:'Kapora iade edildi: '+TL(refund),at:now()})}
  save();close();render();toast(refund>0?'İade edildi – müşteriye '+TL(refund)+' kapora iadesi yapın':'İade edildi','ok')}
function repSlip(id){const r=R(id),st=S.settings;modal('Servis Fişi',`<div class="doc" id="printArea">${docHead('TEKNİK SERVİS KABUL FİŞİ',r.code,r.createdAt)}

  <div class="row"><input id="ptAdj" type="number" inputmode="numeric" placeholder="± puan" style="flex:1"><button class="btn sm" onclick="App.ptAdj('${ph}')">Puan düzelt</button></div>

  <h3 style="margin:14px 0 6px">Servis kayıtları</h3><div class="list">${reps.map(r=>`<div class="it click" onclick="App.rep('${r.id}')"><div class="grow small"><b>${esc(r.code)}</b> · ${esc(r.brand+' '+r.model)}<div class="muted">${esc(r.issue).slice(0,80)}</div></div><span class="tag">${esc(STEPS[r.status])}</span></div>`).join('')||'<div class="small muted">Yok</div>'}</div>`)}

/* --- Raporlar --- */
function periodStart(k){const d=new Date();d.setHours(0,0,0,0);if(k==='hafta')d.setDate(d.getDate()-6);if(k==='ay')d.setDate(1);if(k==='yil')d.setMonth(0,1);if(k==='tum')return'';return d.toISOString()}
function vRapor(){const k=UI.rpt,st=periodStart(k),ss=S.sales.filter(s=>s.at>=st);const rev=sumBy(ss,s=>s.total),cost=sumBy(ss,s=>s.cost),prof=rev-cost;
  const grp={};ss.forEach(s=>s.items.forEach(i=>{const g=i.t==='d'?'Telefon':['rp','lab','ext'].includes(i.t)?'Teknik Servis':i.t==='f'?'Hizmet':'Aksesuar';const o=grp[g]=grp[g]||{rev:0,prof:0};o.rev+=i.price*i.qty;o.prof+=(i.price-i.cost)*i.qty}));
  const pay={};ss.forEach(s=>{const v=cashIn(s);if(v)pay[s.pay]=(pay[s.pay]||0)+v});S.payments.filter(x=>x.at>=st).forEach(x=>{pay[x.pay]=(pay[x.pay]||0)+x.amount});
  const ver=sumBy(ss.filter(s=>s.pay==='Veresiye'),s=>s.collected??s.total);if(ver)pay['Veresiye (açık hesap)']=ver;
  const gid=sumBy(S.cash.filter(c=>c.at>=st&&c.type==='gider'),c=>c.amount),gel=sumBy(S.cash.filter(c=>c.at>=st&&c.type==='gelir'),c=>c.amount);
  const top={};ss.forEach(s=>s.items.filter(i=>i.t==='p').forEach(i=>{top[i.name]=(top[i.name]||0)+i.qty}));const topA=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxG=Math.max(1,...Object.values(grp).map(g=>g.rev)),maxP=Math.max(1,...Object.values(pay)),maxT=Math.max(1,...topA.map(t=>t[1]));
  const repDone=S.repairs.filter(r=>r.status===6&&r.deliveredAt>=st).length;const trade=ss.filter(s=>s.tradeIn);
  const stockCost=sumBy(S.products,p=>p.cost*Math.max(p.stock,0)),devStock=S.devices.filter(d=>d.status!=='Satıldı');
  const sumTxt=`${S.settings.shopName} – ${({bugun:'Gün sonu',hafta:'Son 7 gün',ay:'Bu ay',yil:'Bu yıl',tum:'Tüm zamanlar'})[k]} raporu (${dOnly(now())})\nCiro: ${TL(rev)}\nBrüt kâr: ${TL(prof)}\nGiderler: ${TL(gid)}\nNet kâr: ${TL(prof+gel-gid)}\nİşlem: ${ss.length}\n${Object.entries(pay).map(([p,v])=>`${p}: ${TL(v)}`).join('\n')}\nTeslim edilen tamir: ${repDone}`;
  return `<div class="hdr"><h1 class="t">Raporlar</h1><span class="sp"></span><button class="btn sm" onclick='App.copy(${JSON.stringify(sumTxt).replace(/'/g,"&#39;")})'>📋 Özeti kopyala</button></div>
  <div class="seg" style="margin-bottom:12px">${PERIODS.map(([a,b])=>`<button class="${k===a?'on':''}" onclick="App.rpt('${a}')">${b}</button>`).join('')}</div>
  <div class="kpis"><div class="card kpi hl"><div class="l">Ciro</div><div class="v">${TL(rev)}</div></div><div class="card kpi"><div class="l">Maliyet</div><div class="v">${TL(cost)}</div></div><div class="card kpi"><div class="l">Brüt kâr</div><div class="v okc">${TL(prof)}</div><div class="small muted">Marj %${rev?Math.round(prof/rev*100):0}</div></div><div class="card kpi"><div class="l">İşlem / Sepet ort.</div><div class="v">${ss.length}</div><div class="small muted">${TL(ss.length?rev/ss.length:0)}</div></div><div class="card kpi"><div class="l">Teslim edilen tamir</div><div class="v">${repDone}</div></div><div class="card kpi"><div class="l">Takas</div><div class="v">${trade.length}</div></div><div class="card kpi"><div class="l">Giderler / ek gelir</div><div class="v badc">${TL(gid)}</div><div class="small muted">+${TL(gel)} ek gelir</div></div><div class="card kpi hl"><div class="l">Net kâr (giderler sonrası)</div><div class="v ${prof+gel-gid>=0?'okc':'badc'}">${TL(prof+gel-gid)}</div></div><div class="card kpi"><div class="l">Veresiye alacak</div><div class="v warnc">${TL(totalDebt())}</div></div></div>
  <div class="grid g3"><div class="card hbars"><h3>Alanlara göre ciro & kâr</h3>${Object.entries(grp).map(([g,o])=>`<div class="hb"><span>${g}</span><div class="tr"><i style="width:${o.rev/maxG*100}%"></i></div><span class="small"><b>${TL(o.rev)}</b><br><span class="okc">${TL(o.prof)}</span></span></div>`).join('')||'<div class="empty small">Veri yok</div>'}</div>
  <div class="card hbars"><h3>Ödeme şekli (kasaya giren + tahsilat)</h3>${Object.entries(pay).map(([p,v])=>`<div class="hb"><span>${esc(p)}</span><div class="tr"><i style="width:${v/maxP*100}%"></i></div><b class="small">${TL(v)}</b></div>`).join('')||'<div class="empty small">Veri yok</div>'}</div>
  <div class="card hbars"><h3>En çok satan aksesuarlar</h3>${topA.map(([n,q])=>`<div class="hb"><span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span><div class="tr"><i style="width:${q/maxT*100}%"></i></div><b class="small">${q}</b></div>`).join('')||'<div class="empty small">Veri yok</div>'}</div>
  ${techCard(st)}<div class="card"><h3>Envanter değeri</h3><div class="tot"><span class="muted">Aksesuar/parça (maliyet)</span><b>${TL(stockCost)}</b></div><div class="tot"><span class="muted">Telefon stoğu (${devStock.length} adet, maliyet)</span><b>${TL(sumBy(devStock,devCost))}</b></div><div class="tot"><span class="muted">Telefon stoğu satış değeri</span><b>${TL(sumBy(devStock,d=>d.price))}</b></div><div class="tot big"><span>Toplam bağlı sermaye</span><span>${TL(stockCost+sumBy(devStock,devCost))}</span></div></div></div>
  <h2 class="sec">Satış hareketleri</h2><div class="card list">${ss.slice().reverse().slice(0,60).map(s=>`<div class="it click" onclick="App.receipt('${s.id}')"><div class="thumb">${s.kind==='tamir'?'🔧':s.kind==='takas'?'⇄':s.kind==='online'?'🛒':'🧾'}</div><div class="grow"><div class="nm">${esc(s.no)} · ${esc(s.name||'Perakende')}</div><div class="small muted">${dt(s.at)} · ${esc(s.pay)} · ${esc(s.items.map(i=>i.name).join(', ')).slice(0,70)}</div></div><div class="col" style="align-items:flex-end"><b>${TL(s.total)}</b><span class="small okc">+${TL(s.total-s.cost)}</span></div></div>`).join('')||'<div class="empty">Bu dönemde satış yok</div>'}</div>`}


/* --- Teknisyen raporu --- */
function techCard(st){const m={};S.repairs.filter(r=>r.status===6&&r.deliveredAt>=st).forEach(r=>{const k=r.tech||'Atanmamış';const o=m[k]=m[k]||{n:0,rev:0,prof:0};o.n++;const sl=r.saleId&&SL(r.saleId);if(sl){o.rev+=sl.total;o.prof+=sl.total-sl.cost}});const e=Object.entries(m).sort((a,b)=>b[1].rev-a[1].rev);
  return `<div class="card"><h3>👨‍🔧 Teknisyen performansı</h3>${e.map(([k,o])=>`<div class="tot"><span>${esc(k)} <span class="muted small">(${o.n} cihaz)</span></span><span><b>${TL(o.rev)}</b> · <span class="okc">${TL(o.prof)}</span></span></div>`).join('')||'<div class="empty small">Bu dönemde teslim edilen tamir yok</div>'}</div>`}

/* --- Randevu (müşteri + yönetim) --- */
function slotFull(d,t){return S.appointments.filter(a=>a.date===d&&a.time===t&&a.status!=='İptal').length>=2}
function slotsHTML(d){const nowHM=new Date().toTimeString().slice(0,5),td=ymd(now());return SLOTS.map(t=>{const past=d<td||(d===td&&t<=nowHM),full=slotFull(d,t),dis=past||full;return `<label style="${dis?'opacity:.35;pointer-events:none':''}"><input type="radio" name="time" value="${t}" ${dis?'disabled':''}>${t}${full?' · dolu':''}</label>`}).join('')}
function apFormHTML(d){return `<form id="mform" onsubmit="return false"><div class="fg">${F('Ad Soyad','name','','text','autocomplete="name"')}${F('Cep telefonu','phone','','tel','inputmode="tel" placeholder="05xx…"')}${SEL('Marka','brand',BRANDS,'Apple')}${F('Model','model','','text','placeholder="iPhone 13"')}</div>${TA('Sorun / talep','issue','')}<div class="fg">${F('Tarih','date',d,'date','min="'+ymd(now())+'" onchange="App.apDate(this.value)"')}<div></div></div><div class="small muted b" style="margin-bottom:6px">Saat seç</div><div class="checks" id="slots">${slotsHTML(d)}</div></form>`}
function apDate(v){UI.apDate=v;const el=$('#slots');if(el)el.innerHTML=slotsHTML(v)}
function vRandevuAl(){const d=UI.apDate&&UI.apDate>=ymd(now())?UI.apDate:ymd(now());UI.apDate=d;return `<h1 class="t" style="margin-bottom:6px">Servis Randevusu</h1><p class="muted" style="margin-bottom:14px">Gün ve saat seç; cihazını getirdiğinde sıra beklemeden ilgilenelim.</p><div class="card" style="max-width:560px">${apFormHTML(d)}<button class="btn pri w" onclick="App.apSave()">Randevu Oluştur</button></div>`}
function apForm(){UI.apDate=ymd(now());modal('📅 Randevu Ekle',apFormHTML(UI.apDate),`<button class="btn pri" onclick="App.apSave(true)">Kaydet</button>`)}
function apSave(adm){const f=formData();if(!f.name||f.name.trim().length<3)return toast('Ad soyad gerekli','bad');if(normPhone(f.phone).length!==10)return toast('Geçerli bir cep telefonu yaz','bad');if(!f.model)return toast('Cihaz modelini yaz','bad');if(!f.date||f.date<ymd(now()))return toast('Geçerli bir tarih seç','bad');if(!f.time)return toast('Bir saat seç','bad');if(slotFull(f.date,f.time))return toast('Bu saat doldu, başka bir saat seç','bad');
  const a={id:uid(),no:'R-'+(++S.seq.appt),at:now(),name:f.name.trim(),phone:normPhone(f.phone),brand:f.brand,model:f.model.trim(),issue:(f.issue||'').trim(),date:f.date,time:f.time,status:adm?'Onaylandı':'Bekliyor'};S.appointments.push(a);upsertCustomer(a.name,a.phone);save();
  if(adm){close();render();toast('Randevu eklendi ✓','ok');return}
  render();const msg=`Merhaba, ${dOnly(a.date+'T12:00')} ${a.time} için servis randevusu oluşturdum (${a.no}).\n${a.brand} ${a.model}${a.issue?' – '+a.issue:''}\n${a.name} – ${fmtPhone(a.phone)}`;
  modal('Randevun alındı 📅',`<div class="empty" style="padding:10px"><div class="e">✅</div><h3>${esc(dOnly(a.date+'T12:00'))} · ${esc(a.time)}</h3><p class="muted" style="margin-top:6px">Randevu no: ${esc(a.no)}. Onay mesajını WhatsApp'tan ileteceğiz.</p></div>`,(S.settings.whatsapp?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(S.settings.whatsapp,msg)}">WhatsApp ile Bildir</a>`:'')+`<button class="btn pri" onclick="App.close()">Tamam</button>`)}
const AST=['Bekliyor','Onaylandı','Geldi','Gelmedi','İptal'];

  <div class="seg" style="margin-bottom:10px">${[['bugun','Bugün'],['yaklasan','Yaklaşan'],['gecmis','Geçmiş'],['tum','Tümü']].map(([k,t])=>`<button class="${f===k?'on':''}" onclick="App.apF('${k}')">${t}</button>`).join('')}</div>
  <div class="grid g3">${as.map(a=>`<div class="card"><div class="row" style="justify-content:space-between"><b>📅 ${esc(dOnly(a.date+'T12:00'))} · ${esc(a.time)}</b><span class="tag ${a.status==='Onaylandı'||a.status==='Geldi'?'ok':a.status==='Bekliyor'?'warn':'bad'}">${esc(a.status)}</span></div>
  <div style="margin:8px 0"><b>${esc(a.name)}</b> · ${esc(fmtPhone(a.phone))}<div class="small muted">${esc(a.brand+' '+a.model)}${a.issue?' – '+esc(a.issue):''}</div></div>
  <select onchange="App.apSt('${a.id}',this.value)">${AST.map(x=>`<option ${a.status===x?'selected':''}>${x}</option>`).join('')}</select>

function vGelirGider(){const k=UI.gg||'ay',st=periodStart(k);const ss=S.sales.filter(x=>x.at>=st),cs=S.cash.filter(c=>c.at>=st),ps=S.payments.filter(x=>x.at>=st);
  const sp=sumBy(ss,x=>x.total-x.cost),gel=sumBy(cs.filter(c=>c.type==='gelir'),c=>c.amount),gid=sumBy(cs.filter(c=>c.type==='gider'),c=>c.amount),net=sp+gel-gid;
  const flow={};const add=(p,v)=>{if(v)flow[p]=(flow[p]||0)+v};ss.forEach(x=>add(x.pay,cashIn(x)));ps.forEach(x=>add(x.pay,x.amount));cs.forEach(c=>add(c.pay,c.type==='gelir'?c.amount:-c.amount));
  const tt=UI.ggType||'gider';const byCat={};cs.filter(c=>c.type==='gider').forEach(c=>{byCat[c.cat]=(byCat[c.cat]||0)+c.amount});const mx=Math.max(1,...Object.values(byCat));

  <div class="kasa"><div class="card"><h3 style="margin-bottom:10px">Yeni kayıt</h3><div class="seg" style="margin-bottom:12px"><button class="${tt==='gider'?'on':''}" onclick="App.ggType('gider')">➖ Gider</button><button class="${tt==='gelir'?'on':''}" onclick="App.ggType('gelir')">➕ Gelir</button></div>
  <form id="mform" onsubmit="return false"><div class="fg">${SEL('Kategori','cat',tt==='gider'?GIDER_CATS:GELIR_CATS,'')}${F('Tutar (₺)','amount','','number','inputmode="decimal"')}${SEL('Ödeme','pay',PAYS,'Nakit')}${F('Tarih','date',ymd(now()),'date')}</div>${F('Açıklama','note','','text','placeholder="Örn: Kasım kirası"')}<button class="btn pri w" onclick="App.ggAdd()">Kaydet</button></form>
  ${Object.keys(byCat).length?`<div class="hbars" style="margin-top:14px"><b class="small muted">Gider dağılımı</b>${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="hb"><span class="small">${esc(c)}</span><div class="tr"><i style="width:${v/mx*100}%"></i></div><b class="small">${TL(v)}</b></div>`).join('')}</div>`:''}</div>
  <div class="card sticky"><h3 style="margin-bottom:6px">Kasa akışı (dönem)</h3>${Object.entries(flow).map(([p,v])=>`<div class="tot"><span class="muted">${esc(p)}</span><b class="${v<0?'badc':''}">${TL(v)}</b></div>`).join('')||'<div class="empty small">Hareket yok</div>'}<div class="tot big"><span>Net kasa</span><span>${TL(sumBy(Object.values(flow),v=>v))}</span></div><p class="small muted">Satışlar + tahsilat/kapora + ek gelir − giderler. Veresiye satışlar tahsil edilince kasaya girer.</p></div></div>
  <h2 class="sec">Hareketler</h2><div class="card list">${rows.map(x=>x._k==='c'?`<div class="it"><div class="thumb">${x.type==='gider'?'➖':'➕'}</div><div class="grow"><div class="nm">${esc(x.cat)}</div><div class="small muted">${dt(x.at)} · ${esc(x.pay)}${x.note?' · '+esc(x.note):''}</div></div><b class="${x.type==='gider'?'badc':'okc'}">${x.type==='gider'?'−':'+'}${TL(x.amount)}</b><button class="btn sm ghost" onclick="App.ggDel('${x.id}')" aria-label="Sil">🗑</button></div>`:`<div class="it"><div class="thumb">💰</div><div class="grow"><div class="nm">${x.kind==='kapora'?'Kapora':x.kind==='iade'?'Kapora iadesi':'Veresiye tahsilatı'} – ${esc(x.name||'')}</div><div class="small muted">${dt(x.at)} · ${esc(x.pay)}${x.ref?' · '+esc(x.ref):''}</div></div><b class="${x.amount<0?'badc':'okc'}">${x.amount<0?'':'+'}${TL(x.amount)}</b></div>`).join('')||'<div class="empty">Bu dönemde kayıt yok</div>'}</div>`}
